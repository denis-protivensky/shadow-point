name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.65"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The committed Cargo.lock pins tokio 1.21.2; without the lock, 1.65
      # would resolve a transitive dep that needs a newer rustc.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --all-features
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings

  api-fixture:
    # `cargo public-api` on the crate cannot see what `define_sp!` expands.
    # This compile-only crate names every generated item of the 0.5.0 module
    # form, so a removal or rename fails here. (The 0.3.2 parity gate retired
    # with 0.5.0: the module form breaks that surface by design.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check --manifest-path api-fixture/Cargo.toml
      - run: cargo clippy --manifest-path api-fixture/Cargo.toml -- -D warnings
      - run: cargo check --manifest-path api-fixture/Cargo.toml

  reserved-name:
    # The doctest only proves "does not compile"; this fixture proves the
    # intended `compile_error!` survives the rest of the expansion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: "Reserved-name diagnostic"
        run: |
          if cargo check --manifest-path ci/reserved-name/Cargo.toml 2> reserved-name.err; then
            echo "::error::reserved-name fixture compiled"
            exit 1
          fi
          for name in sequence every fires verify guard shared with_dyn when value calls expected installed_at sequence_cv __sp_reported; do
            grep -F "\`$name\` is a reserved hook name" reserved-name.err
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  consumer-docs:
    # In this crate's own `src/`, `define_sp!` is only invoked under
    # `cfg(test)`, so `cargo doc` never resolves a link inside the generated
    # items. Rustdoc does not warn about an explicit link inside such an
    # expansion; it renders a literal dead href. Document a consumer fixture
    # and grep the rendered HTML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ci/consumer-docs
      - run: cargo fmt --check --manifest-path ci/consumer-docs/Cargo.toml
      - run: cargo doc --no-deps
        working-directory: ci/consumer-docs
        env:
          RUSTDOCFLAGS: -D warnings
      - name: "Reject literal crate::/Self:: links in generated docs"
        run: |
          test -d ci/consumer-docs/target/doc
          if grep -R -n -E 'href="(crate|Self|self|super)::' ci/consumer-docs/target/doc; then
            echo "::error::generated rustdoc contains a literal path href" >&2
            exit 1
          fi

  check32:
    # The floor without 64-bit atomics (a downstream consumer's `make
    # check32` compiles this crate as a dependency). `park_timeout()`'s
    # cache must stay on pointer-width atomics; `AtomicU64` does not exist
    # on this target. `--all-targets --all-features`: a stray 64-bit atomic
    # in test code must not slip past a `--lib` check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: armv5te-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets --all-features --target armv5te-unknown-linux-gnueabi

  test32:
    # Executes the suite at 32-bit pointer width: the park-timeout cache's
    # boundary (`usize::MAX` ms) differs from `u64::MAX` there, and the
    # resolver's "at or above the sentinel" arm is reachable only on 32-bit
    # — a `--lib` check type-proves it, this job runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --all-features --target i686-unknown-linux-gnu
